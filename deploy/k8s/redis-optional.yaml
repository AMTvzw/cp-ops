# Optional Redis for shared rate limiting.
# Apply this only if you set REDIS_URL in cp-ops-config.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cp-ops-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cp-ops-redis
  template:
    metadata:
      labels:
        app: cp-ops-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: cp-ops-redis
spec:
  type: ClusterIP
  selector:
    app: cp-ops-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
