services:
  app:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: cp-ops:latest
    container_name: cp-ops
    env_file:
      - ../../.env
    environment:
      NODE_ENV: production
      PORT: "31987"
      # Database, upload storage, session, public origin and secrets are read from ../../.env.
    ports:
      - "${PORT:-31987}:${PORT:-31987}"
    volumes:
      - ../../data:/app/data
      - ../../uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:31987/api/settings"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
