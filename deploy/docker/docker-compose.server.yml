services:
  app:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: cp-ops:latest
    container_name: cp-ops
    env_file:
      - ../../.env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-31987}
      # SQLite defaults (only used when DB_CLIENT=sqlite3)
      DB_CLIENT: ${DB_CLIENT:-sqlite3}
      DB_FILENAME: ${DB_FILENAME:-/app/data/cp_ops.sqlite}
      # Optional external MariaDB/MySQL
      DB_HOST: ${DB_HOST:-}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_NAME: ${DB_NAME:-}
      DB_URL: ${DB_URL:-}
      DB_SSL: ${DB_SSL:-}
      DB_SSL_REJECT_UNAUTHORIZED: ${DB_SSL_REJECT_UNAUTHORIZED:-}
      UPLOAD_STORAGE: ${UPLOAD_STORAGE:-fs}
    ports:
      - "${PORT:-31987}:${PORT:-31987}"
    volumes:
      - ../../data:/app/data
      - ../../uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:31987/api/settings"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
