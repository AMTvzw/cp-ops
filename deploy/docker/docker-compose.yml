services:
  app:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: cp-ops:latest
    container_name: cp-ops
    ports:
      - "31987:31987"
    environment:
      NODE_ENV: production
      PORT: "31987"
      # Default is local SQLite. To use the optional MariaDB service below,
      # set DB_CLIENT=mysql2, DB_HOST=mariadb, DB_USER, DB_PASSWORD, DB_NAME
      # and run with --profile mariadb. See README.md for the full command.
      DB_CLIENT: ${DB_CLIENT:-sqlite3}
      DB_FILENAME: ${DB_FILENAME:-/app/data/cp_ops.sqlite}
      DB_HOST: ${DB_HOST:-}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_NAME: ${DB_NAME:-}
      DB_URL: ${DB_URL:-}
      SESSION_IDLE_TIMEOUT_MINUTES: "60"
      UPLOAD_STORAGE: ${UPLOAD_STORAGE:-fs}
      # Optional external MariaDB/MySQL:
      # DB_HOST: your-db-host
      # DB_PORT: "3306"
      # DB_USER: your-db-user
      # DB_PASSWORD: your-db-password
      # DB_NAME: your-db-name
      # DB_URL: mysql://user:password@host:3306/dbname
      # DB_SSL: "true"
      # DB_SSL_REJECT_UNAUTHORIZED: "true"
      # DB_CONNECT_TIMEOUT_MS: "15000"
      # DB_POOL_MIN: "0"
      # DB_POOL_MAX: "10"
      # DB_POOL_CREATE_TIMEOUT_MS: "10000"
      # DB_POOL_ACQUIRE_TIMEOUT_MS: "15000"
      # DB_POOL_IDLE_TIMEOUT_MS: "30000"
      # DB_POOL_REAP_INTERVAL_MS: "1000"
      # DB_ACQUIRE_CONNECTION_TIMEOUT_MS: "15000"
      # UPLOAD_STORAGE: "db"
      SESSION_SECRET: "replace-with-a-long-random-secret-min-32"
      DEFAULT_ROOT_USERNAME: root
      DEFAULT_ROOT_PASSWORD: "replace-this-password"
      # Optional shared rate limiting backend:
      # REDIS_URL: redis://redis:6379
    volumes:
      - cp_ops_data:/app/data
      - cp_ops_uploads:/app/uploads
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
        required: false
    # Uncomment if REDIS_URL is enabled
    # depends_on:
    #   - redis

  mariadb:
    image: mariadb:11
    container_name: cp-ops-mariadb
    profiles:
      - mariadb
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-cp_ops}
      MARIADB_USER: ${MARIADB_USER:-cp_ops}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-replace-this-db-password}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-replace-this-root-db-password}
    volumes:
      - cp_ops_mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p$${MARIADB_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # Optional Redis for shared rate limiting across instances
  # redis:
  #   image: redis:7-alpine
  #   container_name: cp-ops-redis
  #   restart: unless-stopped
  #   volumes:
  #     - cp_ops_redis:/data

volumes:
  cp_ops_data:
  cp_ops_uploads:
  cp_ops_mariadb:
  # cp_ops_redis:
